name: PHPCS

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Blocking: PHP 8.3+ / WordPress compatibility and the plugin text domain.
      - name: PHPCompatibilityWP + text domain
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      # Advisory: full WordPress Coding Standards report for the legacy code base.
      - name: WordPress Coding Standards (report only)
        run: vendor/bin/phpcs --standard=phpcs-full.xml.dist --report=summary
        continue-on-error: true

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit
